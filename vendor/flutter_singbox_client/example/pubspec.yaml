name: flutter_singbox_client_example
description: Full-featured example app demonstrating all flutter_singbox_client SDK capabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_singbox_client:
    path: ../
  provider: ^6.1.2
  intl: ^0.19.0
  file_picker: ^8.1.2
  share_plus: ^10.1.3
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.2
  http: ^1.2.0
  installed_apps: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
